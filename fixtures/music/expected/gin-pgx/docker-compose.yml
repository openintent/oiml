# Built by OSL once; yours to change. Run with: docker compose up --build
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # The 18 image keeps its data under /var/lib/postgresql/18/docker, so the volume is its parent
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d music"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/music
      OSL_SESSION_SECRET: change-me-to-a-long-random-string
      OSL_APP_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
