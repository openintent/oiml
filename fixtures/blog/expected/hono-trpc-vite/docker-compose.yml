# Built by OSL once; yours to change. Run with: docker compose up --build
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # The 18 image keeps its data under /var/lib/postgresql/18/docker, so the volume is its parent
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blog"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    ports:
      - "3111:3111"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/blog
      OSL_SEAL_KEY: ${OSL_SEAL_KEY:?set OSL_SEAL_KEY to the key sealed fields are encrypted under (64 hexadecimal characters, 32 bytes: openssl rand -hex 32)}
      OSL_SESSION_SECRET: change-me-to-a-long-random-string
      OSL_APP_URL: http://localhost:3111
      OSL_ROLE: all
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["node_modules/.bin/tsx","src/server/main.ts"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/blog
      OSL_SEAL_KEY: ${OSL_SEAL_KEY:?set OSL_SEAL_KEY to the key sealed fields are encrypted under (64 hexadecimal characters, 32 bytes: openssl rand -hex 32)}
      OSL_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
