osl: "1.0"
summary: Admins lock and unlock articles through actions on a read_only flag; a comment's create rule reads the flag through article_id
ops:
  - op: add_field
    entity: Article
    name: locked
    field:
      {
        type: boolean,
        required: true,
        default: false,
        read_only: true,
        description: Set by the lock and unlock actions
      }
  - op: set_rules
    entity: Comment
    rules:
      read: public
      create: "owner:author_id when article_id.locked = false"
      update: "owner:author_id"
      delete: "owner:author_id or owner:article_id.author_id or role:admin"
  - op: update_resource
    name: posts
    resource:
      entity: Article
      operations: [list, get, create, update, delete]
      list:
        filters: [published, author_id]
        order: [[posted_at, desc]]
        include: [author]
        sortable: [title, posted_at]
        search: [title, content]
      get: { include: [author] }
      actions:
        publish:
          description: Mark the article published
          rule: "owner:author_id"
        unpublish_all:
          description: Unpublish every article
          scope: collection
          rule: "role:admin"
          returns: { count: { type: integer, required: true } }
        lock:
          description: Close the article to new comments
          rule: "role:admin"
        unlock:
          description: Reopen the article to comments
          rule: "role:admin"
  - op: update_page
    name: posts
    page:
      resource: posts
      columns: [title, published, locked, posted_at]
      fields: [title, content, published, locked, cover, tags, posted_at, author_id]
  - op: add_scenario
    scenario:
      name: locked articles
      steps:
        - as: alice
          op: posts.create
          body: { title: Heated debate, content: Keep it civil }
          expect: { status: 201, body: { data: { locked: false } } }
          capture: { article: data.id }
        - as: bob
          op: comments.create
          body: { article_id: "{article}", body: First }
          expect: { status: 201 }
        - op: posts.lock
          path: { id: "{article}" }
          expect: { status: 401 }
        - as: bob
          op: posts.lock
          path: { id: "{article}" }
          expect: { status: 403 }
        - as: alice
          op: posts.update
          path: { id: "{article}" }
          body: { locked: true }
          expect: { status: 400 }
        - as: admin
          op: posts.lock
          path: { id: "{article}" }
          expect: { status: 200, body: { data: { locked: true } } }
        - as: bob
          op: comments.create
          body: { article_id: "{article}", body: Too late }
          expect: { status: 403 }
        - as: alice
          op: comments.create
          body: { article_id: "{article}", body: My own article }
          expect: { status: 403 }
        - as: bob
          op: comments.create
          body: { article_id: 6f1d2a3b-4c5d-4e6f-8a9b-0c1d2e3f4a5b, body: Nowhere }
          expect: { status: 403 }
        - as: bob
          op: comments.list
          query: { article_id: "{article}" }
          expect: { status: 200, body: { data: [{ body: First }] } }
        - as: admin
          op: posts.unlock
          path: { id: "{article}" }
          expect: { status: 200, body: { data: { locked: false } } }
        - as: bob
          op: comments.create
          body: { article_id: "{article}", body: Open again }
          expect: { status: 201, body: { data: { body: Open again } } }
