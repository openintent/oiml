osl: "1.0"
title: Integrations, preferences and sealed secrets
ask: >-
  People connect the blog to other systems. An integration is a webhook, a Slack channel or an email list, and what
  it needs depends on which: a webhook has a URL and a number of retries, a Slack integration a channel and whether
  to mention it, an email list its addresses. Each has a signing secret that is stored encrypted and never shown
  again, not even to its owner; the server signs payloads with it. It can also hold an access token, encrypted too,
  which only the owner gets back. People also keep preferences (a theme, whether they want the digest, quiet
  hours) and a recovery code that is encrypted and theirs alone.
acceptance:
  - A webhook without a URL, a Slack integration with a webhook's settings and an unknown setting are all refused, naming the setting
  - Changing an integration's kind without sending the settings of the new kind is refused
  - The signing secret is never in any answer; signing a payload gives the signature the secret implies
  - The owner reads the token back exactly as written; an admin sees the integration without it
  - Someone's recovery code is in their own profile and nobody else's, also beside an integration they own
  - A theme that does not exist, a wrong quiet hour and an unknown preference are refused; the digest defaults to on
