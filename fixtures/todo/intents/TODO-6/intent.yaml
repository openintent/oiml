osl: "1.0"
title: Home at the root with counts per status and per project
ask: >-
  The app should open straight on the home dashboard. Besides the totals, show one count per task status and
  one per project, and keep the numbers fresh while the page is open.
acceptance:
  - Opening the app at / shows the home dashboard
  - There is a count tile for each status and one for each project
