osl: "1.0"
summary: "Invoice under a team: a number from a sequence counted per team (INV-000001), a total as money in the row's currency and a fee as money in USD, a count of invoices on Team, a table page; an invoice page at /invoices/:id"
ops:
  - op: add_entity
    name: Invoice
    entity:
      fields:
        id: { type: uuid, primary: true }
        team_id:
          type: uuid
          required: true
          relation: { entity: Team, name: team, reverse: invoices, on_delete: cascade }
        number: { type: sequence, prefix: "INV-", scope: [team_id], width: 6 }
        customer: { type: string, max_length: 160, required: true, validate: { min_length: 1 } }
        currency: { type: enum, enum_values: [USD, EUR, JPY], required: true, default: USD }
        total: { type: money, currency_field: currency, required: true, validate: { min: "0" } }
        fee: { type: money, currency: USD, description: Handling fee }
        created_at: { type: datetime, required: true, default: now }
      rules:
        read: "member:team_id"
        create: "member:team_id"
        update: "member:team_id:admin"
        delete: "member:team_id:admin"
  - op: add_field
    entity: Team
    name: invoice_count
    field: { type: integer, count_of: invoices }
  - op: add_resource
    name: invoices
    resource:
      entity: Invoice
      operations: [list, get, create, update, delete]
      list:
        filters: [team_id, number, currency, total]
        sortable: [number, total, created_at]
        search: [number, customer]
  - op: add_page
    name: invoices
    page:
      resource: invoices
      layout: table
      columns: [number, customer, total, fee, created_at]
  - op: set_sidebar
    sidebar:
      items:
        - { page: home, icon: house }
        - { page: teams, icon: building }
        - { page: projects, icon: folder-kanban }
        - { page: tasks, icon: list-checks }
        - { page: milestones, icon: flag }
        - { page: requests, icon: kanban }
        - { page: invoices, icon: receipt }
        - { page: notes, icon: sticky-note }
        - { page: members, icon: users }
        - { page: invites, icon: mail-plus }
        - { page: channels, icon: hash }
        - { page: messages, icon: message-square }
      footer: { user: true, settings: true }
  - op: add_page
    name: invoice
    page:
      kind: detail
      resource: invoices
      path: /invoices/:id
      fields: [number, customer, total, currency, fee, created_at]
  - op: add_scenario
    scenario:
      name: numbered invoices and exact amounts
      steps:
        - as: alice
          op: teams.create
          body: { name: Initech }
          expect: { status: 201, body: { data: { name: Initech, invoice_count: 0 } } }
          capture: { team_a: data.id }
        - as: bob
          op: teams.create
          body: { name: Globex }
          expect: { status: 201 }
          capture: { team_b: data.id }
        - as: alice
          op: invoices.create
          body: { team_id: "{team_a}", customer: Acme, total: "19.99" }
          expect:
            status: 201
            body: { data: { number: INV-000001, customer: Acme, currency: USD, total: "19.9900", fee: null } }
          capture: { first: data.id }
        - as: alice
          op: invoices.create
          body: { team_id: "{team_a}", customer: Bolt, currency: EUR, total: "0.3", fee: "0.1" }
          expect: { status: 201, body: { data: { number: INV-000002, currency: EUR, total: "0.3000", fee: "0.1000" } } }
        - as: bob
          op: invoices.create
          body: { team_id: "{team_b}", customer: Cyberdyne, currency: JPY, total: "999999999999999.9999" }
          expect: { status: 201, body: { data: { number: INV-000001, currency: JPY, total: "999999999999999.9999" } } }
        - as: bob
          op: invoices.create
          body: { team_id: "{team_b}", customer: Dunder, total: "123456789012345.6789", fee: "0.0001" }
          expect:
            status: 201
            body: { data: { number: INV-000002, total: "123456789012345.6789", fee: "0.0001" } }
        - as: alice
          op: invoices.create
          body: { team_id: "{team_a}", customer: Float, total: 19.99 }
          expect: { status: 400 }
        - as: alice
          op: invoices.create
          body: { team_id: "{team_a}", customer: Digits, total: "1.23456" }
          expect: { status: 400 }
        - as: alice
          op: invoices.create
          body: { team_id: "{team_a}", customer: Below, total: "-0.0001" }
          expect: { status: 400 }
        - as: alice
          op: invoices.create
          body: { team_id: "{team_a}", customer: Numbered, total: "1", number: INV-000009 }
          expect: { status: 400 }
        - as: bob
          op: invoices.create
          body: { team_id: "{team_a}", customer: Intruder, total: "1" }
          expect: { status: 403 }
        - as: alice
          op: invoices.create
          body: { team_id: "{team_a}", customer: Cog, total: "5" }
          expect: { status: 201, body: { data: { number: INV-000003, total: "5.0000" } } }
          capture: { third: data.id }
        - as: alice
          op: invoices.list
          query: { team_id: "{team_a}", number: INV-000002 }
          expect: { status: 200, body: { data: [{ customer: Bolt, total: "0.3000" }], page: { total: 1 } } }
        - as: alice
          op: invoices.list
          query: { team_id: "{team_a}", total: "19.99" }
          expect: { status: 200, body: { data: [{ number: INV-000001 }], page: { total: 1 } } }
        - as: alice
          op: invoices.list
          query: { team_id: "{team_a}", total: "19.990001" }
          expect: { status: 400 }
        - as: alice
          op: invoices.list
          query: { team_id: "{team_a}", q: "inv-000003" }
          expect: { status: 200, body: { data: [{ customer: Cog }], page: { total: 1 } } }
        - as: alice
          op: invoices.list
          query: { team_id: "{team_a}", sort: "number:desc" }
          expect:
            status: 200
            body: { data: [{ number: INV-000003 }, { number: INV-000002 }, { number: INV-000001 }], page: { total: 3 } }
        - as: alice
          op: invoices.list
          query: { team_id: "{team_a}", currency: USD, sort: "total:desc" }
          expect: { status: 200, body: { data: [{ total: "19.9900" }, { total: "5.0000" }], page: { total: 2 } } }
        - as: bob
          op: invoices.list
          expect: { status: 200, body: { data: [{ customer: Dunder }, { customer: Cyberdyne }], page: { total: 2 } } }
        - as: bob
          op: invoices.get
          path: { id: "{first}" }
          expect: { status: 403 }
        - as: alice
          op: invoices.update
          path: { id: "{first}" }
          body: { currency: EUR }
          expect: { status: 400 }
        - as: alice
          op: invoices.update
          path: { id: "{first}" }
          body: { currency: EUR, total: "18.5" }
          expect: { status: 200, body: { data: { number: INV-000001, currency: EUR, total: "18.5000" } } }
        - as: alice
          op: invoices.update
          path: { id: "{first}" }
          body: { currency: EUR, customer: Acme Europe }
          expect: { status: 200, body: { data: { customer: Acme Europe, currency: EUR, total: "18.5000" } } }
        - as: alice
          op: invoices.update
          path: { id: "{first}" }
          body: { number: INV-000042 }
          expect: { status: 400 }
        - as: alice
          op: invoices.update
          path: { id: "{first}" }
          body: { team_id: "{team_b}" }
          expect: { status: 400 }
        - as: alice
          op: teams.get
          path: { id: "{team_a}" }
          expect: { status: 200, body: { data: { invoice_count: 3 } } }
        - as: alice
          op: invoices.delete
          path: { id: "{third}" }
          expect: { status: 204 }
        - as: alice
          op: invoices.create
          body: { team_id: "{team_a}", customer: Dyne, total: "7.5" }
          expect: { status: 201, body: { data: { number: INV-000004 } } }
        - as: alice
          op: teams.get
          path: { id: "{team_a}" }
          expect: { status: 200, body: { data: { invoice_count: 3 } } }
