osl: "1.0"
title: No team ever sees another team's data, enforced in the database
ask: >-
  The rules already keep one team's projects, tasks, notes, milestones and channels from another team. Make the
  database refuse it too, whatever the code above it does: a request reads and writes only rows of the teams its
  caller belongs to, plus what a public project deliberately opens to everyone. Nothing a caller sees or may do
  today changes, except that being a task's assignee or a note's author no longer reaches a team's rows once the
  person has left the team.
acceptance:
  - Every earlier scenario passes unchanged
  - An assignee removed from the team gets 403 for their task and may not update it, lists none of the team's tasks, and still reads a public project's task like anyone else
  - Someone who belongs to two teams lists the tasks of both in one request
  - The cross-tenant walk passes a second time with the generated rule checks switched off, and the app's database role without a bound team reads no row of any team table except the tasks of public projects
