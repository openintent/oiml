osl: "1.0"
title: Requests and approvals
ask: >-
  Members of a team file purchase requests: a title and an amount. A request starts pending. The team's admins
  approve or decline a pending request, and the time of the decision is recorded; the member who filed a declined
  request can reopen it. People see and edit their own requests while they are pending, and admins see every
  request of the team. A request nobody decided expires on its own after fourteen days; nobody can expire one by
  hand. A team shows how many of its requests are pending. Give the team a board of requests by status.
acceptance:
  - A member who is not an admin is refused when approving, and so is someone from another team
  - Approving a request that is not pending is a conflict
  - A declined request can be reopened by the member who filed it, and by nobody else
  - A request can be edited by its author only while it is pending
  - The team's count of pending requests follows every step, the expiry included
