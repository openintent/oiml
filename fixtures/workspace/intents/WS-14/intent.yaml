osl: "1.0"
title: Milestones in order, with labels
ask: >-
  A project's milestones are in an order its team keeps: a new milestone goes last, any member moves one to another
  place, and removing one closes the gap. A team has labels, and a member puts labels on a milestone; a milestone
  shows its labels by name. A label and a milestone belong to one team: a label of another team cannot be put on a
  milestone. Nobody outside the team sees or moves any of it.
acceptance:
  - Milestones added to a project are numbered in order; a member moves the last one first and the others follow
  - Someone outside the team gets the 404 a missing milestone gets when they try to move one
  - A milestone read back lists its labels with their names
  - Putting another team's label on a milestone is refused
