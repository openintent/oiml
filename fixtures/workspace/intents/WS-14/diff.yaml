osl: "1.0"
summary: "Request under a team with a status state machine (approve, decline, reopen, and an expire only a timer runs), a count of pending requests on Team, a board by status"
ops:
  - op: add_entity
    name: Request
    entity:
      fields:
        id: { type: uuid, primary: true }
        team_id:
          type: uuid
          required: true
          relation: { entity: Team, name: team, reverse: requests, on_delete: cascade }
        requester_id:
          type: uuid
          required: true
          relation: { entity: User, name: requester, on_delete: cascade }
        title: { type: string, max_length: 160, required: true, validate: { min_length: 1 } }
        amount: { type: integer, required: true, validate: { min: 1 } }
        status:
          type: enum
          enum_values: [pending, approved, declined, expired]
          required: true
          default: pending
          read_only: true
        decided_at: { type: datetime, read_only: true }
        created_at: { type: datetime, required: true, default: now }
      rules:
        read: "owner:requester_id or member:team_id:admin"
        create: "member:team_id and owner:requester_id"
        update: "owner:requester_id when status = pending"
        delete: "member:team_id:admin"
      transitions:
        field: status
        approve: { from: [pending], to: approved, rule: "member:team_id:admin", stamp: decided_at }
        decline: { from: [pending], to: declined, rule: "member:team_id:admin", stamp: decided_at }
        reopen: { from: [declined], to: pending, rule: "owner:requester_id" }
        expire: { from: [pending], to: expired, rule: none }
  - op: add_field
    entity: Team
    name: pending_requests
    field: { type: integer, count_of: requests, where: "status = pending" }
  - op: add_resource
    name: requests
    resource:
      entity: Request
      operations: [list, get, create, update, delete]
      list: { filters: [team_id, status, requester_id], order: [[created_at, asc]] }
      update: { fields: [title, amount] }
  - op: set_timers
    timers:
      - { on: Task, at: due_at, run: tasks.remind, when: "done = false" }
      - { on: Request, at: created_at, after: 14d, run: requests.expire }
  - op: add_page
    name: requests
    page:
      resource: requests
      layout: board
      group_by: status
      columns: [title, amount, status]
  - op: set_sidebar
    sidebar:
      items:
        - { page: teams, icon: building }
        - { page: projects, icon: folder-kanban }
        - { page: tasks, icon: list-checks }
        - { page: milestones, icon: flag }
        - { page: requests, icon: kanban }
        - { page: notes, icon: sticky-note }
        - { page: members, icon: users }
        - { page: channels, icon: hash }
        - { page: messages, icon: message-square }
      footer: { user: true, settings: true }
  - op: add_scenario
    scenario:
      name: requests and approvals
      steps:
        - as: alice
          op: teams.create
          body: { name: Initech }
          expect: { status: 201, body: { data: { pending_requests: 0 } } }
          capture: { team: data.id }
        - as: bob
          op: auth.me
          expect: { status: 200 }
          capture: { bob_id: data.id }
        - as: alice
          op: members.create
          body: { team_id: "{team}", user_id: "{bob_id}" }
          expect: { status: 201, body: { data: { role: member } } }
        - as: bob
          op: requests.create
          body: { team_id: "{team}", title: Standing desk, amount: 450 }
          expect: { status: 201, body: { data: { status: pending, decided_at: null, requester_id: "{bob_id}" } } }
          capture: { desk: data.id }
        - as: bob
          op: requests.create
          body: { team_id: "{team}", title: Approved by hand, amount: 1, status: approved }
          expect: { status: 400 }
        - as: alice
          op: teams.get
          path: { id: "{team}" }
          expect: { status: 200, body: { data: { pending_requests: 1 } } }
        - as: bob
          op: requests.update
          path: { id: "{desk}" }
          body: { amount: 480 }
          expect: { status: 200, body: { data: { amount: 480, status: pending } } }
        - as: bob
          op: requests.update
          path: { id: "{desk}" }
          body: { status: approved }
          expect: { status: 400 }
        - op: requests.approve
          path: { id: "{desk}" }
          expect: { status: 401 }
        - as: carol
          op: requests.approve
          path: { id: "{desk}" }
          expect: { status: 403 }
        - as: carol
          op: requests.reopen
          path: { id: "{desk}" }
          expect: { status: 403 }
        - as: bob
          op: requests.approve
          path: { id: "{desk}" }
          expect: { status: 403 }
        - as: alice
          op: requests.reopen
          path: { id: "{desk}" }
          expect: { status: 403 }
        - as: bob
          op: requests.reopen
          path: { id: "{desk}" }
          expect: { status: 409 }
        - as: alice
          op: requests.decline
          path: { id: "{desk}" }
          expect: { status: 200, body: { data: { title: Standing desk, status: declined } } }
          capture: { declined_at: data.decided_at }
        - as: alice
          op: requests.decline
          path: { id: "{desk}" }
          expect: { status: 409 }
        - as: alice
          op: requests.approve
          path: { id: "{desk}" }
          expect: { status: 409 }
        - as: alice
          op: teams.get
          path: { id: "{team}" }
          expect: { status: 200, body: { data: { pending_requests: 0 } } }
        - as: bob
          op: requests.update
          path: { id: "{desk}" }
          body: { amount: 500 }
          expect: { status: 403 }
        - as: bob
          op: requests.reopen
          path: { id: "{desk}" }
          expect: { status: 200, body: { data: { status: pending, decided_at: "{declined_at}" } } }
        - as: bob
          op: requests.update
          path: { id: "{desk}" }
          body: { amount: 500 }
          expect: { status: 200, body: { data: { amount: 500 } } }
        - as: alice
          op: requests.approve
          path: { id: "{desk}" }
          expect: { status: 200, body: { data: { status: approved, amount: 500 } } }
        - as: bob
          op: requests.create
          body: { team_id: "{team}", title: Team offsite, amount: 1200 }
          expect: { status: 201, body: { data: { status: pending } } }
          capture: { offsite: data.id }
        - as: alice
          op: teams.get
          path: { id: "{team}" }
          expect: { status: 200, body: { data: { pending_requests: 1 } } }
        - op: timers.run
          body: { now: "{now+13d}" }
          expect: { status: 200 }
        - as: bob
          op: requests.get
          path: { id: "{offsite}" }
          expect: { status: 200, body: { data: { status: pending } } }
        - op: timers.run
          body: { now: "{now+15d}" }
          expect: { status: 200 }
        - as: bob
          op: requests.get
          path: { id: "{offsite}" }
          expect: { status: 200, body: { data: { status: expired, decided_at: null } } }
        - as: bob
          op: requests.get
          path: { id: "{desk}" }
          expect: { status: 200, body: { data: { status: approved } } }
        - as: alice
          op: teams.get
          path: { id: "{team}" }
          expect: { status: 200, body: { data: { pending_requests: 0 } } }
        - as: alice
          op: requests.approve
          path: { id: "{offsite}" }
          expect: { status: 409 }
        - as: alice
          op: requests.list
          query: { team_id: "{team}", status: expired }
          expect: { status: 200, body: { data: [{ title: Team offsite }], page: { total: 1 } } }
        - as: carol
          op: requests.get
          path: { id: "{desk}" }
          expect: { status: 403 }
        - as: carol
          op: requests.list
          query: { team_id: "{team}" }
          expect: { status: 200, body: { data: [], page: { total: 0 } } }
