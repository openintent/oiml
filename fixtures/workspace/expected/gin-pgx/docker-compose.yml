# Built by OSL once; yours to change. Run with: docker compose up --build
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workspace
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workspace"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/workspace
      DATABASE_APP_URL: postgres://workspace_app:${OSL_APP_DB_PASSWORD:?set OSL_APP_DB_PASSWORD to the password osl migrate gave workspace_app}@postgres:5432/workspace
      OSL_SESSION_SECRET: change-me-to-a-long-random-string
      OSL_APP_URL: http://localhost:8080
      OSL_ROLE: all
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/workspace
      OSL_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
