version: 0.1.0
type: osl.intent
ai_context:
  purpose: Conform to project frameworks, style, and conventions.
  instructions: >-
    - CRITICAL: Call the MCP tool `get_agents_guide` FIRST before proceeding to
    retrieve the OSL Agents implementation guide and apply the instructions to
    the intent.
  references:
    - kind: mcp_tool
      tool: get_agents_guide
      description: OSL Agents implementation guide containing workflow instructions,
        framework-specific patterns, and best practices
provenance:
  created_by:
    type: human
    name: OSL maintainers
  created_at: 2026-11-05T14:18:18Z
intents:
  - kind: rename_field
    scope: data
    entity: Post
    from: body
    to: content

  - kind: add_field
    scope: data
    entity: Post
    fields:
      - name: published
        type: boolean
        required: true
        default: false
