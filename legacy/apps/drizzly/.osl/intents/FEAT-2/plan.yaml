version: 0.1.0
created_at: 2026-11-05T14:25:00Z
intent_id: FEAT-2
project_id: drizzly
model: claude-opus-5-5
intents_to_process: 2
template_used:
  framework: drizzle
  category: database
  pack: osl://compat/osl-drizzle/1.0.0
  version: 1.0.0
  compat:
    osl: ">=0.1.0 <0.2.0"
    drizzle-orm: ">=0.45.0 <1.0.0"
    drizzle-kit: ">=0.31.0 <1.0.0"
steps:
  - kind: rename_field
    scope: data
    target: Post.body
    description: Rename posts.body to content using the non-interactive rename procedure
    changes:
      - file: lib/schema.ts
        action: modify
        description: Rename the body column key to content
      - file: drizzle/NNNN_rename_post_body_to_content.sql
        action: create
        description: Custom migration with ALTER TABLE RENAME COLUMN and patched snapshot
        dependencies:
          - lib/schema.ts
      - file: app/api/posts/route.ts
        action: modify
        description: Accept and validate content instead of body
  - kind: add_field
    scope: data
    target: Post.published
    description: Add required boolean published with default false
    changes:
      - file: lib/schema.ts
        action: modify
        description: Add published boolean not null default false
      - file: drizzle/NNNN_add_post_published.sql
        action: create
        description: Generate migration with drizzle-kit generate
        dependencies:
          - lib/schema.ts
      - file: app/api/posts/route.ts
        action: modify
        description: Accept optional published on POST
planned_changes:
  - file: lib/schema.ts
    action: modify
    description: Rename body to content and add published
  - file: drizzle/NNNN_rename_post_body_to_content.sql
    action: create
    description: Rename migration
  - file: drizzle/NNNN_add_post_published.sql
    action: create
    description: Add column migration
  - file: app/api/posts/route.ts
    action: modify
    description: Use content and accept published
risk_assessment:
  level: medium
  factors:
    - Column rename on an existing table with data
  mitigations:
    - Rename uses ALTER TABLE RENAME COLUMN, so existing data is kept
    - Rename and add are generated as separate migrations to avoid interactive prompts
warnings: []
estimated_duration: 3 minutes
