name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm test
      - name: Snapshots match the generators
        run: pnpm conformance --snapshot-only
      - name: The eval grader accepts the fixtures' own diffs
        run: pnpm evals --proposer oracle --no-full --out /tmp/osl-evals-oracle

  conformance:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prove every backend against every fixture
        env:
          OSL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: pnpm conformance
