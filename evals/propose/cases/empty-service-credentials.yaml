id: empty-service-credentials
tags: [entity, fields, sealed, visibility, rules, auth, scenario]
base: { empty: credentials }
intent:
  title: Credentials for other services
  ask: >-
    People sign up and keep the credentials their scripts need for other services: a name, the service's address
    and its API key. The API key must be encrypted in the database, so that a copy of the database gives nothing
    away. Its owner can read it back when they need to copy it; nobody else ever sees a credential. Each one also
    has a note, and the owner finds a credential by searching its name or its note.
  acceptance:
    - The owner creates a credential and reads the API key back exactly as it was entered
    - Another signed-in person can neither read nor list the credential
    - The owner replaces the API key and reads the new one back
    - The list is searched by name and note
expect:
  entities: [User, "Credential|ServiceCredential|ApiCredential|Secret"]
  sealed: ["Credential|ServiceCredential|ApiCredential|Secret.api_key|key|token|value|secret"]
  field_read:
    "Credential|ServiceCredential|ApiCredential|Secret.api_key|key|token|value|secret": "owner:owner_id|owner:user_id"
  rules: { "Credential|ServiceCredential|ApiCredential|Secret": { read: "owner:owner_id|owner:user_id" } }
  list: { "credentials|service_credentials|api_credentials|secrets": { search: ["name", "note|notes"] } }
  scenarios: { min: 1 }
  touches:
    - "credentials.create|service_credentials.create|api_credentials.create|secrets.create"
    - "credentials.update|service_credentials.update|api_credentials.update|secrets.update"
  ops: { forbid: [add_action] }
notes: >-
  A secret the server gives back to one caller: `sealed: true` with `read: "owner:<the owner field>"` on a string
  field. Without `read:` a sealed field is write-only through the API, which this ask does not want; `hidden`
  would keep it from its owner too, and a plain string with a read rule is not encrypted. The API key is in no
  filter and no search (M185 would refuse it); name and note are. The scenario writes a key, reads it back as the
  owner, shows a second person 403 on the row, and replaces the key.
