id: blog2-view-counter
tags: [actions, fields]
base: { fixture: blog, through: FEAT-2 }
intent:
  title: View counts
  ask: Track how many times each post has been viewed. Recording a view is open to anyone, and the count is part of the post.
  acceptance:
    - Recording a view as an anonymous reader succeeds
expect:
  fields: { Post: ["view_count|views|view_counter"] }
  types: { "Post.view_count|views|view_counter": "integer|bigint" }
  field_props: { "Post.view_count|views|view_counter": { default: 0, read_only: true } }
  actions_on: { posts: { scope: row, rule: public } }
  scenarios: { min: 1 }
  touches: [posts]
notes: The count is the server's to keep, so it is read_only and only the view action moves it.
