id: ws2-public-roadmap
tags: [app, rules, tenancy, generated-origin]
base: { fixture: workspace, through: WS-6 }
intent:
  title: Public project roadmap
  ask: >-
    A team can mark a project as public. A public project gets a roadmap page anyone can open without signing in,
    showing its tasks grouped into to do and done with a count for each. Projects that are not public stay as
    they are, and logged-out visitors cannot change anything.
  acceptance:
    - A logged-out visitor opens the roadmap of a public project and sees the task counts
    - A logged-out visitor opening a project that is not public is refused
    - A logged-out visitor cannot create or change tasks
expect:
  fields: { Project: ["public|is_public|visibility"] }
  pages:
    "roadmap|public_roadmap|status|public_projects": { access: public }
  scenarios: { min: 1, rejections: 1, statuses: [401] }
notes: >-
  Promoted from generated round 2 (gen-r2-05). Needs a public page (access: public) over data the read rules open
  with row conditions: the project by its own flag (public when public = true) and its tasks through the project
  (public when project_id.public = true). Starts before WS-7, which opens the tasks of public projects that way.
