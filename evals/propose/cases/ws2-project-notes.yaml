id: ws2-project-notes
tags: [tenancy, rules, relation, entity]
base: { fixture: workspace, through: WS-6 }
intent:
  title: Project notes
  ask: >-
    Members leave notes on a project: a body and who wrote it. Only a member of the project's team can write one,
    and a note is always filed under the member who wrote it. Everyone in the project's team can read them; only
    the writer or a team admin can delete one.
  acceptance:
    - A user outside the team cannot read a project's notes, nor write one
    - A member's note carries that member as its writer
    - Another member deleting my note gets 403; a team admin succeeds
expect:
  entities: ["Note|ProjectNote"]
  fields: { "Note|ProjectNote": ["body|content|text", project_id, "author_id|user_id"] }
  relations: ["Note|ProjectNote.* -> Project", "Note|ProjectNote.* -> User"]
  rules:
    "Note|ProjectNote":
      read: "member:project_id.team_id|member:project_id.team_id:member"
      create: "member:project_id.team_id and owner:author_id|member:project_id.team_id and owner:user_id"
      delete: "owner:author_id or member:project_id.team_id:admin|owner:user_id or member:project_id.team_id:admin"
  resources: ["notes|project_notes"]
  scenarios: { min: 1, rejections: 1, statuses: [403] }
notes: >-
  Without a team column on the note, the rules must follow project_id to the team; deletion combines the
  writer (owner) with the team's admins, and creation needs both membership and the bound author, which is a
  conjunction. A diff that copies team_id onto the note and uses plain member rules, or that settles for
  membership alone on create, fails the rules check on purpose. Starts before WS-7, which builds exactly this.
