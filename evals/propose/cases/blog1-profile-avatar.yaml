id: blog1-profile-avatar
tags: [files, fields, rules]
base: { fixture: blog, through: FEAT-1 }
intent:
  title: Profile bio and avatar
  ask: >-
    Users get an optional bio of up to 500 characters and an avatar image. Avatars are images only, at
    most 2 MB. Users edit their own profile as before, and anyone can see avatars.
  acceptance:
    - Uploading a PDF as an avatar is rejected
    - A profile comes back with the avatar's URL
expect:
  fields: { User: [bio, "avatar|avatar_image|photo|picture"] }
  types: { "User.avatar|avatar_image|photo|picture": file, User.bio: "string|text" }
  file_accept: { "User.avatar|avatar_image|photo|picture": "image/" }
  rules: { User: { update: "owner:id" } }
  files: { read: public }
  scenarios: { min: 1 }
  any_of:
    - { types: { User.bio: string }, field_props: { User.bio: { max_length: 500 } } }
    - field_props: { User.bio: { validate: { max_length: 500 } } }
notes: >-
  The bio's limit is a string's own max_length, or validate.max_length on a string or a text field: the reference
  gives max_length to strings only, and on a text field nothing enforces it, so text with max_length fails, as does
  a bio with no limit.
