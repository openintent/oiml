id: fx-blog-17-author-contact
tags: [fixture, fields, rules, auth, visibility, scenario]
base: { fixture: blog, through: FEAT-16 }
oracle: fixtures/blog/intents/FEAT-17/diff.yaml
intent:
  title: Author contact and editor notes
  ask: >-
    People can add a phone number to their profile. Only the person and the admins see it: everyone else reads the
    profile without it, in lists and beside an article too. The time someone was banned is theirs and the admins'
    as well. An article has a note for the editors that only admins read: the author who wrote it does not get it
    back, whatever they do with the article.
  acceptance:
    - Someone sees their own phone number in their profile and when they ask who they are; another user and a visitor do not
    - An admin sees everyone's phone number, in the list of users too
    - An article's author is shown beside it without the phone number, except to the author and to admins
    - The author creates, edits, submits, publishes, archives and restores an article and never gets the editor note back
    - An admin reads the editor note, also in the answer to approving the article
expect:
  fields: { User: ["phone|phone_number"], Article: ["editor_note|editors_note|note_for_editors|editor_notes"] }
  field_read:
    "User.phone|phone_number": "owner:id or role:admin"
    "User.banned_at": "owner:id or role:admin"
    "Article.editor_note|editors_note|note_for_editors|editor_notes": "role:admin"
  absent_entities: ["Contact|Profile|EditorNote"]
  scenarios: { min: 1 }
  touches: [users.get, posts.create]
  ops: { require: [add_field, update_field], forbid: [add_entity, add_action] }
notes: >-
  Three field rules without tenancy. The phone is on the identity: `owner:id` is "the person", and what auth.me
  answers is the caller's own row as their own session may read it. `banned_at` exists, so it takes update_field,
  which the contract walk reports as a property that may now be absent. The editor note is read by admins only
  while the article's update rule lets its author write it: M174 warns, and the ask says that is meant. The users
  resource must list phone in update.fields for anyone to set it. Nothing here is hidden: a hidden field would
  keep the phone from its owner too.
