id: blog5-stats-action
tags: [actions, global]
base: { fixture: blog }
intent:
  title: Admin statistics
  ask: An admin-only endpoint that returns how many articles exist, how many are published, and how many users there are.
  acceptance:
    - A member calling it gets 403
    - The admin gets the counts
expect:
  actions_on: { actions: { rule: "role:admin", returns: fields } }
  actor_fields: { role: admin }
  scenarios: { min: 1, rejections: 1, statuses: [403, 200] }
  touches: [actions]
notes: The blog fixture already has an admin actor by FEAT-5, so the scenario can call the action as admin.
