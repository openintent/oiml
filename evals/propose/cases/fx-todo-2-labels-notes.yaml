id: fx-todo-2-labels-notes
tags: [fixture, junction, relation, no-auth]
base: { fixture: todo, through: TODO-1 }
oracle: fixtures/todo/intents/TODO-2/diff.yaml
intent:
  title: Labels and notes
  ask: >-
    Tasks can carry any number of labels, and a label can sit on many tasks. A task can have at most
    one note with longer text. Deleting a task removes its note and its label links.
expect:
  entities: [Label, "TaskNote|Note"]
  junction: [[Task, Label]]
  relations: ["TaskNote|Note.* -> Task:cascade"]
  resources: [labels]
  scenarios: { min: 1 }
