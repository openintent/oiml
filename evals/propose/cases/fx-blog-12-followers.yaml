id: fx-blog-12-followers
tags: [fixture, entity, rules, relation, unique, scenario]
base: { fixture: blog, through: FEAT-11 }
oracle: fixtures/blog/intents/FEAT-12/diff.yaml
intent:
  title: Followers and bulletins
  ask: >-
    Signed-in users follow other users; following someone twice is a conflict, and only the follower can unfollow.
    Anyone can list who follows whom. Authors post short bulletins that only their followers can read: a bulletin's
    author sees their own, a follower of the author sees it, and nobody else does, signed in or not.
  acceptance:
    - A duplicate follow is a conflict; unfollowing as someone else is refused
    - A follower reads the author's bulletin; a signed-in user who does not follow the author is refused and lists none
    - A visitor who is not signed in is asked to sign in
    - After unfollowing, the former follower is refused
expect:
  entities: ["Follow|UserFollow", Bulletin]
  relations: ["Follow|UserFollow.* -> User:cascade", "Bulletin.* -> User:cascade"]
  unique_together: { "Follow|UserFollow": ["follower_id|user_id", "followee_id|followed_id|following_id"] }
  rules:
    Bulletin:
      read: "owner:author_id or member:author_id.followers"
      create: "owner:author_id"
  scenarios: { min: 1, rejections: 3, statuses: [409, 403, 401] }
  touches: [bulletins]
notes: >-
  A membership relation on the identity itself: Follow has two relations to User, and the one the path arrives
  through (followee_id, reverse followers) is set aside, so the member column is follower_id. No tenancy, no ranked
  enum. The read rule's spelling is the expectation; a handler-kept list of followers fails it on purpose.
