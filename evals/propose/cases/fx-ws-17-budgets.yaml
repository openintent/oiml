id: fx-ws-17-budgets
tags: [fixture, fields, rules, tenancy, isolation, visibility, counts, app, scenario]
base: { fixture: workspace, through: WS-16 }
oracle: fixtures/workspace/intents/WS-17/diff.yaml
intent:
  title: Budgets and estimates
  ask: >-
    A project has a budget that only the admins of its team see: an ordinary member reads the project without it,
    in the list too, and the projects table shows them no budget column. A team's number of pending requests is for
    its admins as well. A task has an estimate in hours for people who are signed in: a visitor reading the tasks of
    a public project does not get it, and nor does a visitor who opens the task's share link, which works for the
    tasks of public projects.
  acceptance:
    - A member reads a project and its budget is not in the answer, alone or in a list; an admin gets it
    - A member who changes the budget is not told the budget back, and the admin then reads the new one
    - The creator of a team reads its count of pending requests in the answer to creating it
    - A member reads the team without the count of pending requests, which still follows the requests
    - A visitor reads a public project's task without its estimate; someone signed in reads it with it
    - A task has a share link anyone may open; a visitor who opens one of a private project's tasks is asked to sign in
expect:
  fields: { Project: ["budget"], Task: ["estimate|estimate_hours|hours"] }
  field_read:
    "Project.budget": "member:team_id:admin"
    "Team.pending_requests": "member:id:admin"
    "Task.estimate|estimate_hours|hours": "authenticated|authenticated and member:project_id.team_id"
  absent_entities: ["Budget|ProjectBudget"]
  scenarios: { min: 1 }
  touches: [projects.get, projects.update]
  ops: { require: [add_field, update_field], forbid: [add_entity, add_action] }
notes: >-
  Field rules on tenant tables under isolation: database. The budget and the count are for the team's admins
  (`member:team_id:admin`, `member:id:admin` on the tenant itself); the count already exists, so it takes
  update_field, and the database goes on counting whatever the rule says. A field rule reads the row and the
  caller, so the estimate on Task, which reaches its team through the project, cannot say "members": the ask says
  "signed in", which is `authenticated`, and M176 tells the proposer that this includes people outside the team on
  a public project's tasks. A second entity for the budget, a hidden field or a handler that strips it has not
  used the construct. Proving it takes `expect.absent`, which the partial body match cannot replace. Since the merge with round A3 the projects page filters by {tenant.id}, which an update_page restates; the share link is a public detail page over tasks (kind: detail, access: public).
