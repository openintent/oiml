id: fx-blog-18-integrations
tags: [fixture, entity, fields, sealed, json, shape, visibility, actions, events, scenario]
base: { fixture: blog, through: FEAT-17 }
oracle: fixtures/blog/intents/FEAT-18/diff.yaml
intent:
  title: Integrations, preferences and sealed secrets
  ask: >-
    People connect the blog to other systems. An integration is a webhook, a Slack channel or an email list, and what
    it needs depends on which: a webhook has a URL and a number of retries, a Slack integration a channel and whether
    to mention it, an email list its addresses. Each has a signing secret that is stored encrypted and never shown
    again, not even to its owner; the server signs payloads with it. It can also hold an access token, encrypted too,
    which only the owner gets back. People also keep preferences (a theme, whether they want the digest, quiet
    hours) and a recovery code that is encrypted and theirs alone.
  acceptance:
    - A webhook without a URL, a Slack integration with a webhook's settings and an unknown setting are all refused, naming the setting
    - Changing an integration's kind without sending the settings of the new kind is refused
    - The signing secret is never in any answer; signing a payload gives the signature the secret implies
    - The owner reads the token back exactly as written; an admin sees the integration without it
    - Someone's recovery code is in their own profile and nobody else's, also beside an integration they own
    - A theme that does not exist, a wrong quiet hour and an unknown preference are refused; the digest defaults to on
expect:
  entities: ["Integration|Connection"]
  types:
    "Integration|Connection.kind|type|provider": enum
    "Integration|Connection.config|settings|configuration|options": json
    "User.preferences|settings|prefs": json
  sealed:
    - "Integration|Connection.secret|signing_secret|webhook_secret"
    - "Integration|Connection.token|access_token|api_token"
    - "User.recovery_code|recovery_phrase"
  shapes:
    "Integration|Connection.config|settings|configuration|options": "shape_by:kind|type|provider"
    "User.preferences|settings|prefs": shape
  field_read:
    "Integration|Connection.secret|signing_secret|webhook_secret": none
    "Integration|Connection.token|access_token|api_token": "owner:owner_id|owner:user_id"
    "User.recovery_code|recovery_phrase": "owner:id"
  actions: ["integrations.sign|integrations.sign_payload|connections.sign|connections.sign_payload"]
  scenarios: { min: 1, rejections: 4, statuses: [400] }
  touches: ["integrations.create|connections.create", "integrations.update|connections.update", users.update]
  ops: { require: [add_entity, add_field] }
notes: >-
  The three constructs of round B6's second half in one ask. The secret and the token are `sealed: true`; the
  secret has no `read:` (nobody gets it back, and an action's handler opens it to sign), the token is read by its
  owner. A hidden field would keep the secret from the handler's caller as well but stores it in the clear; a hash
  cannot sign. The settings are one json field with `shape_by` over the kind enum, not three nullable groups of
  columns, one json field per kind, or a plain json field a handler validates. The preferences are a json field
  with a `shape` and one nested level. The 400s are a wrong key for the kind, a missing required key, an unknown
  key and a kind changed without its settings. The ask asks for no page, so none is expected (the fixture's diff
  adds one).
