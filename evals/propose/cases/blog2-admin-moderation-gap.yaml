id: blog2-admin-moderation-gap
tags: [gap, rules]
base: { fixture: blog, through: FEAT-2 }
intent:
  title: Admin moderation
  ask: Admins can edit or delete any post, not only their own. Authors keep editing their own posts.
expect:
  outcome: any
  flags_limit: true
  rules: { Post: { read: public } }
notes: >-
  A rule is one predicate, so "owner or admin" cannot be written today. The case records what the agent
  does with an ask the model cannot express; any valid diff that keeps posts readable counts.
