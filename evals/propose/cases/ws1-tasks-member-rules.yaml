id: ws1-tasks-member-rules
tags: [tenancy, rules, relation, entity]
base: { fixture: workspace, through: WS-1 }
intent:
  title: Project tasks
  ask: >-
    Projects hold tasks with a title and a done flag. Members of the project's team see and edit its
    tasks; nobody outside the team can.
  acceptance:
    - A non-member cannot list or create a project's tasks
expect:
  entities: [Task]
  relations: ["Task.* -> Project"]
  rules:
    {
      Task:
        {
          read: "member:project_id.team_id|member:team_id",
          create: "member:project_id.team_id|member:project_id.team_id:member|member:team_id|member:team_id:member",
          update: "member:project_id.team_id|member:project_id.team_id:member|member:team_id|member:team_id:member"
        }
    }
  resources: [tasks]
  scenarios: { min: 1, rejections: 1, statuses: [403] }
notes: >-
  A member rule may follow the relation to the project and test its team (member:project_id.team_id), so
  Task needs only project_id; a copied team_id with a plain member rule also passes.
