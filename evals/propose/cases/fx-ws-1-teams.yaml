id: fx-ws-1-teams
tags: [fixture, tenancy, auth, rules, entity]
base: { empty: workspace }
oracle: fixtures/workspace/intents/WS-1/diff.yaml
intent:
  title: Teams, members and projects
  ask: >-
    People sign up and create teams. Whoever creates a team owns it. Owners and admins add members and
    set their roles; members see and create the team's projects; admins can delete projects; only an owner
    can delete the team or remove members.
  acceptance:
    - A user who is not a member sees none of a team's projects and cannot create one
    - The creator of a team is its owner
    - A member can create and update projects but not delete them; an admin can delete them
    - Only an owner can delete a team
expect:
  entities: [User, Team, "TeamMember|Membership|TeamMembership|Member", Project]
  auth:
    identity: User
    providers: [credentials]
    tenancy: { entity: Team, membership: "TeamMember|Membership|TeamMembership|Member" }
  relations: ["Project.* -> Team"]
  rules:
    Project: { read: "member:team_id", create: "member:team_id|member:team_id:member", delete: "member:team_id:admin" }
    Team: { delete: "member:id:owner" }
  resources: [teams, projects]
  scenarios: { min: 1, rejections: 1, statuses: [403] }
