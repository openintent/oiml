id: fx-blog-14-editorial-review
tags: [fixture, fields, enum, rules, transitions, timers, events, counts, app, scenario]
base: { fixture: blog, through: FEAT-13 }
oracle: fixtures/blog/intents/FEAT-14/diff.yaml
intent:
  title: Editorial review
  ask: >-
    Articles go through a review. An author submits a draft; an admin approves it or sends it back; an approved
    article can be retired by its author or an admin. Nobody sets the status by hand. Record when an article was
    approved and when it was retired. Thirty days after approval an article retires on its own, and thirty days after
    that it is archived. A user shows how many approved articles they have. Publishing stays what it is. Give the
    editors a board of articles by status where a card can only be dragged along a step its viewer may take, and tell
    the newsroom when an article is approved.
  acceptance:
    - Only the author submits a draft, and submitting twice is a conflict
    - Only an admin approves or rejects, and only an article in review; approving records when
    - Setting the status in a create or an update is refused
    - A user's count of approved articles follows the review
    - An approved article retires by itself after thirty days, and one retired by hand is left as it was
expect:
  transitions:
    Article:
      - "submit|submit_for_review|request_review"
      - "approve|accept"
      - "reject|send_back|return|decline"
      - "retire|withdraw|unpublish"
  types: { "Article.status|review_status|review|state": enum }
  field_props: { "Article.status|review_status|review|state": { read_only: true } }
  counts: ["User.* -> Article"]
  archive: [Article]
  actions_on: { posts: { scope: row, rule: "role:admin" } }
  events: ["posts.approve|posts.accept"]
  timers: ["Article.approved_at|accepted_at -> posts.retire|posts.withdraw|posts.unpublish"]
  pages: { "desk|review|board|editorial|review_board|editorial_desk": { kind: resource, layout: board } }
  scenarios: { min: 1, rejections: 3, statuses: [403, 409, 400] }
  touches: ["posts.submit|posts.submit_for_review|posts.request_review", "posts.approve|posts.accept", timers.run]
  ops: { require: [set_transitions, set_timers], forbid: [add_action, set_archive] }
notes: >-
  The entity archives already (FEAT-13), so the step that takes an approved article out is a transition under
  another name than archive (M151 refuses that one) and the second timer runs the compiler's own posts.archive.
  Both timers run compiler-written row actions as the system and need no `when`: the state is the guard. The
  retire rule carries a row condition on the status, so an author is refused (403) where an admin gets the
  conflict (409). The publish action with its handler stays. Actions with handlers that set the status, or a
  writable status with rules about its values, have not used the construct.
