id: ws1-invites-gap
tags: [gap, tenancy, entity, actions]
base: { fixture: workspace, through: WS-1 }
intent:
  title: Invitations
  ask: >-
    Owners and admins invite people to a team by email. The invitee gets a link; accepting it makes them
    a member. Pending invitations are listed per team and can be revoked.
expect:
  outcome: any
  entities: ["Invite|Invitation|TeamInvite|TeamInvitation"]
  relations: ["Invite|Invitation|TeamInvite|TeamInvitation.* -> Team"]
  fields: { "Invite|Invitation|TeamInvite|TeamInvitation": [email] }
notes: There is no invite construct; the agent should model it as an entity with actions and leave the email to a handler.
