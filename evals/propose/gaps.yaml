    kind: not_delivered
    status: open
    first_seen: r2
    last_seen: r7
    cases: 2
    note: "Design for the count case: docs/designs/archive-and-counts.md (count_of over a reverse relation); sums
      stay open. Exercise (docs/exercises/spotify.md): follower, like, track and play counts are count_of; a chart
      over a window stays a schedule writing a read_only rank. Slack (docs/exercises/slack.md): unread counts compare
      a channel's messages with the viewer's own marker and reaction counts group by emoji; neither is count_of, and
      a per-viewer count is likely declined as a custom page or an action."
