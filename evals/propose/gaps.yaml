  # Entries below came from the clone exercises (docs/exercises/*.md, from 2026-11-09): an application decomposed into
  # intents by hand, with what no intent can say. cases is 0 until a round reports them.
  - key: membership through any relation
    kind: not_delivered
    status: built
    first_seen: exercise-spotify
    last_seen: exercise-slack
    cases: 0
    construct: "member:<path> ending in a membership relation (a reverse relation to a junction with a relation to the
      identity), :role over an enum marked ranked: true"
    version: unreleased
    note: "member: is bound to the one tenancy entity, so a second membership shape (playlist collaborators beside
      artist teams, a document shared with people) has no predicate. Sketch in docs/exercises/spotify.md: a predicate
      over a reverse relation to a junction with an identity relation, compiled to the EXISTS subquery member: uses.
      Slack (docs/exercises/slack.md) needs it in four intents (private channels, posting, conversations, files),
      through a path (in:channel_id.members on Message) and in a conjunction with an owner binding. Notion
      (docs/exercises/notion.md) adds a ranked level on the junction (in:shares:edit, as member:<field>:<role> ranks)
      and teamspaces nested under the workspace. All three exercises hit it. Design:
      docs/designs/membership-through-any-relation.md (the last segment of a member: path may be a membership
      relation; :role ranks an enum marked ranked: true)."
  - key: actor conditions
    kind: not_delivered
    status: open
    first_seen: exercise-spotify
    last_seen: exercise-spotify
    cases: 0
    note: "when names the row's fields and role: is the only actor attribute a rule tests; premium-only streaming, an
      explicit-content setting and country availability need when actor.<field> = <value>. Sketch in
      docs/exercises/spotify.md."
  - key: search across resources
    kind: not_delivered
    status: open
    first_seen: exercise-spotify
    last_seen: exercise-spotify
    cases: 0
    note: "One box over tracks, artists, albums and playlists. Likely declined: a custom page composes the per-resource
      searches; recorded so a round that asks twice decides it (docs/exercises/spotify.md)."
  - key: cursor pagination
    kind: not_delivered
    status: open
    first_seen: exercise-slack
    last_seen: exercise-slack
    cases: 0
    note: "Lists answer page numbers and a total (a count per request); a message log wants before and after anchors
      on the order columns, newest first, with no count. Sketch in docs/exercises/slack.md: list.paging: cursor when
      the order ends in a unique column, a keyset WHERE on every backend, the page loading older rows on scroll."
  - key: conditions against now
    kind: not_delivered
    status: open
    first_seen: exercise-slack
    last_seen: exercise-slack
    cases: 0
    note: "Nothing compares a field against now in rules or filters (the reference says to decline due before today
      and upcoming); Slack needs an edit window (owner for fifteen minutes) and a date range in search. Sketch in
      docs/exercises/slack.md: when created_at > now-15m on any predicate and a range filter on lists, spelled as the
      scenarios spell time; row checks compare with ctx.now, lists with the request clock."
  - key: search and ranking
    kind: not_delivered
    status: open
    first_seen: exercise-slack
    last_seen: exercise-slack
    cases: 0
    note: "Full-text search over message bodies ranked by relevance (docs/exercises/slack.md); substring search stays
      the default. Sketch: search mode full_text as a tsvector column with a GIN index and ts_rank ordering, SQL on
      every backend. Notion (docs/exercises/notion.md) also searches a page by its blocks' text, a search through a
      relation. Waits for a round to ask."
  - key: rules inherited through a tree
    kind: not_delivered
    status: open
    first_seen: exercise-notion
    last_seen: exercise-notion
    cases: 0
    note: "A page without its own sharing takes its parent's, all the way up; paths are fixed length and no predicate
      recurses. Sketch in docs/exercises/notion.md: rules.inherit: parent_id, evaluating on the nearest row up the chain
      with its own shares, as a recursive query for row checks and a maintained column for lists. The largest
      construct an exercise has named; waits for a round to ask."
  - key: navigation from data
    kind: not_delivered
    status: open
    first_seen: exercise-notion
    last_seen: exercise-notion
    cases: 0
    note: "The sidebar lists declared pages (a name, a label, an icon), never rows; Notion's sidebar is a tree of pages
      per section plus recents. Sketch in docs/exercises/notion.md: a sidebar item kind tree { resource, parent, label,
      filter } linking to a parameterized page, and a recent kind. Needs pages with parameters first."
  - key: tree queries
    kind: not_delivered
    status: open
    first_seen: exercise-notion
    last_seen: exercise-notion
    cases: 0
    note: "Ancestors for breadcrumbs, descendants for duplicating, archiving or publishing a subtree, and a refusal
      when a move would make a row its own descendant. Sketch in docs/exercises/notion.md: tree: true on a
      self-relation adding ancestors and descendants routes and the cycle check, recursive CTEs on every backend.
      Rounds file these asks under relations beyond many-to-one."
  - key: user-defined schemas
    kind: not_delivered
    status: open
    first_seen: exercise-notion
    last_seen: exercise-notion
    cases: 0
    note: "Notion's databases: properties the users define at runtime, rows typed by them, views with filters, sorts
      and formulas. Out by construction; recommended declined with the sentence a schema the users define is data,
      with properties and values as rows and their typing, filters and formulas a handler or a custom page
      (docs/exercises/notion.md)."
