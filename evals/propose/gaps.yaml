    kind: not_delivered
    status: built
    first_seen: run6-rules-opus-5-5
    last_seen: r5
    cases: 6
    construct: row conditions on rules (when <field> = <value>, a7b0817)
    version: unreleased
    note: Drafts visible only to their author, approval states, archived rows; built 2026-11-09 with
      todo TODO-5 and workspace WS-4.
