      (invites to a private channel from its page) and blog FEAT-14 (co-authors by invite). An account that does not
      exist yet is made by the accept. Slack (docs/exercises/slack.md) also wants a join link not bound to an email,
      which the design declines: see shared secrets and access codes. Verified registration is round A6. Design:
      docs/designs/invites.md. Round r9 drew four invitation briefs. Three were graded in the round: each declared
      auth.invites and drove a create and an accept, one of them for a third invited membership beside the workspace
