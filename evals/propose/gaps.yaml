# The gap backlog: what agents could not express, by cluster. pnpm evals:gaps appends new clusters as open and
# refreshes cases and last_seen; a person sets built (with construct and version) or declined (with the note).
gaps:
  - key: rules on a field's value
    kind: not_delivered
    status: built
    first_seen: run6-rules-opus-5-5
    last_seen: r5
    cases: 6
    construct: row conditions on rules (when <field> = <value>, a7b0817)
    version: unreleased
    note: Drafts visible only to their author, approval states, archived rows; built 2026-11-09 with
      todo TODO-5 and workspace WS-4.
  - key: pages beyond master-detail
    kind: not_delivered
    status: built
    first_seen: run6-rules-opus-5-5
    last_seen: r5
    cases: 5
    construct: page access, filter with {actor.id}, refresh, tile group_by, a dashboard or custom page at /
    version: unreleased
    note: Built 2026-11-09 with blog FEAT-8 and todo TODO-6; round r4 used the constructs 20 times and
      no longer reported the cluster.
  - key: scheduled and recurring work
    kind: not_delivered
    status: built
    first_seen: gen-r1-opus-5-5
    last_seen: r4
    cases: 3
    construct: schedules (cron, actions.<name> or <resource>.<action>) and timers (on, at, after, run,
      when), with timers.run, schedules.run and emails.sent steps
    version: unreleased
    note: Built 2026-11-09 with blog FEAT-9, workspace WS-6 and todo TODO-7; jobs run on pg-boss and
      River; scenarios drive the clock through the test hooks.
  - key: invites and onboarding
    kind: not_delivered
    status: open
    first_seen: run6-rules-opus-5-5
    last_seen: r5
    cases: 3
    note: Where the SaaS set starts; needs an invitation that an account not yet registered can accept.
  - key: rule conjunctions
    kind: not_delivered
    status: open
    first_seen: gen-r1-opus-5-5
    last_seen: r3
    cases: 1
    note: A create rule cannot require membership and bind the author to the session at once; rules have
      alternatives, not conjunctions.
